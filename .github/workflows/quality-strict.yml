name: Linux x64 · shared quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      ratchets: true
      code-dupes: true
      code-dupes-report: false
      allow-empty-shell: true
